<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2020" viewBox="0 0 800 2020" role="img" aria-labelledby="title desc">
  <title id="title">불나방 작성 요청 처리 흐름</title>
  <desc id="desc">사용자가 본문을 보내면 Next.js 서버가 브라우저 ID를 SHA-256 작성자 식별값으로 변환하고 입력, 위험 표현, 작성 횟수를 검사한다. 검사를 통과하면 content, symbol_type, author_hash를 Supabase posts 테이블에 저장하며 작성 시각과 만료 시각은 데이터베이스 기본값으로 기록된다.</desc>

  <defs>
    <style>
      text { font-family: "Noto Sans KR Thin", "Noto Sans KR", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      .title { fill: #f3f5f8; font-size: 40px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { fill: #8f99aa; font-size: 24px; font-weight: 500; letter-spacing: -0.2px; }
      .lane { fill: #8290a5; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
      .number { fill: #0a0d14; font-size: 19px; font-weight: 700; }
      .card-title { fill: #f0f3f7; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
      .card-code { fill: #bdd0e4; font-size: 25px; font-weight: 600; }
      .card-copy { fill: #9ca6b6; font-size: 25px; font-weight: 500; letter-spacing: -0.2px; }
      .check { fill: #dbe4ee; font-size: 24px; font-weight: 600; letter-spacing: -0.2px; }
      .flow-label { fill: #a6b8cb; font-size: 22px; font-weight: 600; }
      .result { fill: #c7d2df; font-size: 23px; font-weight: 600; letter-spacing: -0.2px; }
      .response { fill: #c7d5e4; font-size: 24px; font-weight: 600; }
      .code { font-family: "DejaVu Sans Mono", Consolas, monospace; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8da1b8"/>
    </marker>
  </defs>

  <rect width="800" height="2020" fill="#090c13"/>
  <rect x="24" y="24" width="752" height="1972" rx="24" fill="none" stroke="#202633" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(55 58)">
    <path d="M17 1c1 13-6 18-11 24-4 5-6 10-6 16 0 12 9 21 21 21s21-9 21-21c0-9-5-16-12-22 1 9-5 12-10 8-5-4 1-14-3-26z" fill="none" stroke="#a9bdd5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 31c6 5 9 9 9 14 0 5-4 9-9 9s-9-4-9-9c0-5 3-9 9-14z" fill="none" stroke="#799dbe" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="108" y="92" class="title">불행을 남기는 요청의 흐름</text>
  <text x="108" y="132" class="subtitle">클라이언트 입력은 서버에서 다시 검증한 뒤에만 저장된다.</text>

  <!-- Browser lane -->
  <text x="72" y="194" class="lane">BROWSER</text>
  <line x1="190" y1="188" x2="728" y2="188" stroke="#252c39" stroke-width="2"/>

  <!-- Step 1 -->
  <g>
    <rect x="72" y="214" width="656" height="146" rx="18" fill="#10151f" stroke="#30394a" stroke-width="2"/>
    <circle cx="106" cy="244" r="16" fill="#a9bdd5"/>
    <text x="106" y="250" text-anchor="middle" class="number">1</text>
    <g transform="translate(150 237)" fill="none" stroke="#9fb3cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 38h54M8 30V4h38v26M16 13h22M16 21h16"/>
      <path d="M45 3l7-7 5 5-7 7-7 2z" fill="#10151f"/>
    </g>
    <text x="230" y="266" class="card-title">사용자 입력</text>
    <text x="230" y="316" class="card-copy">본문 입력 · 보내기 버튼 클릭</text>
  </g>

  <line x1="400" y1="376" x2="400" y2="411" stroke="#8da1b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g>
    <rect x="72" y="428" width="656" height="160" rx="18" fill="#10151f" stroke="#30394a" stroke-width="2"/>
    <circle cx="106" cy="462" r="16" fill="#a9bdd5"/>
    <text x="106" y="469" text-anchor="middle" class="number">2</text>
    <g transform="translate(148 460)" fill="none" stroke="#9fb3cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="62" height="48" rx="5"/>
      <path d="M0 13h62M9 7h1M18 7h1M27 7h1M17 28l-6 5 6 5M45 28l6 5-6 5M35 24l-8 18"/>
    </g>
    <text x="230" y="480" class="card-title">Next.js 클라이언트</text>
    <text x="230" y="524" class="card-code code">sendMind()</text>
    <text x="230" y="562" class="card-copy">JSON 본문과 브라우저 ID 헤더 구성</text>
  </g>

  <line x1="400" y1="604" x2="400" y2="651" stroke="#8da1b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="426" y="612" width="78" height="34" rx="17" fill="#111722" stroke="#303a49"/>
  <text x="465" y="636" text-anchor="middle" class="flow-label code">POST</text>

  <!-- Server lane -->
  <text x="72" y="688" class="lane">SERVER</text>
  <line x1="175" y1="682" x2="728" y2="682" stroke="#252c39" stroke-width="2"/>

  <!-- Step 3 -->
  <g>
    <rect x="72" y="708" width="656" height="150" rx="18" fill="#10151f" stroke="#53667c" stroke-width="2"/>
    <circle cx="106" cy="742" r="16" fill="#a9bdd5"/>
    <text x="106" y="749" text-anchor="middle" class="number">3</text>
    <g transform="translate(150 733)" fill="none" stroke="#9fb3cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 0L0 20l13 20M49 0l13 20-13 20M36 4L25 36"/>
    </g>
    <text x="230" y="756" class="card-title">Route Handler</text>
    <text x="230" y="801" class="card-code code">POST /api/minds</text>
    <text x="230" y="836" class="card-copy">브라우저 ID → SHA-256 작성자 식별값</text>
  </g>

  <line x1="400" y1="874" x2="400" y2="911" stroke="#8da1b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g>
    <rect x="72" y="928" width="656" height="390" rx="18" fill="#10151f" stroke="#53667c" stroke-width="2"/>
    <circle cx="106" cy="962" r="16" fill="#a9bdd5"/>
    <text x="106" y="969" text-anchor="middle" class="number">4</text>
    <g transform="translate(150 944)" fill="none" stroke="#9fb3cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 0c10 8 19 10 27 11v20c0 17-11 27-27 35C11 58 0 48 0 31V11C8 10 17 8 27 0zM16 33l7 7 15-18"/>
    </g>
    <text x="230" y="976" class="card-title">요청 검증 및 제한</text>

    <rect x="230" y="1004" width="458" height="46" rx="10" fill="#151b27" stroke="#2c3544"/>
    <circle cx="255" cy="1027" r="8" fill="none" stroke="#829bb6" stroke-width="2"/>
    <path d="M251 1027l3 3 6-7" fill="none" stroke="#829bb6" stroke-width="2" stroke-linecap="round"/>
    <text x="278" y="1035" class="check">본문: 앞뒤 공백 제거 후 1~300자</text>

    <rect x="230" y="1062" width="458" height="46" rx="10" fill="#151b27" stroke="#2c3544"/>
    <circle cx="255" cy="1085" r="8" fill="none" stroke="#829bb6" stroke-width="2"/>
    <path d="M251 1085l3 3 6-7" fill="none" stroke="#829bb6" stroke-width="2" stroke-linecap="round"/>
    <text x="278" y="1093" class="check">허용된 매개체 ID</text>

    <rect x="230" y="1120" width="458" height="46" rx="10" fill="#151b27" stroke="#2c3544"/>
    <circle cx="255" cy="1143" r="8" fill="none" stroke="#829bb6" stroke-width="2"/>
    <path d="M251 1143l3 3 6-7" fill="none" stroke="#829bb6" stroke-width="2" stroke-linecap="round"/>
    <text x="278" y="1151" class="check">위험 표현 검사</text>

    <rect x="230" y="1178" width="458" height="46" rx="10" fill="#151b27" stroke="#2c3544"/>
    <circle cx="255" cy="1201" r="8" fill="none" stroke="#829bb6" stroke-width="2"/>
    <path d="M251 1201l3 3 6-7" fill="none" stroke="#829bb6" stroke-width="2" stroke-linecap="round"/>
    <text x="278" y="1209" class="check">요청 출처 HMAC 기반 작성 횟수 제한</text>

    <rect x="230" y="1240" width="458" height="58" rx="10" fill="#0d121b" stroke="#354050" stroke-dasharray="5 5"/>
    <text x="249" y="1277" class="result">저장 제외 → 오류·제한·지원 안내 반환</text>
  </g>

  <line x1="400" y1="1334" x2="400" y2="1368" stroke="#8da1b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="420" y="1359" class="flow-label">검사 통과</text>

  <!-- Step 5 -->
  <g>
    <rect x="72" y="1384" width="656" height="170" rx="18" fill="#10151f" stroke="#53667c" stroke-width="2"/>
    <circle cx="106" cy="1418" r="16" fill="#a9bdd5"/>
    <text x="106" y="1425" text-anchor="middle" class="number">5</text>
    <g transform="translate(150 1410)" fill="none" stroke="#9fb3cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h52v42H4zM4 17h52M14 11h1M23 11h1M32 11h1"/>
      <path d="M16 28h28M16 37h20"/>
    </g>
    <text x="230" y="1432" class="card-title">삽입 데이터 구성</text>
    <text x="230" y="1476" class="card-code code">content · symbol_type</text>
    <text x="230" y="1508" class="card-code code">author_hash</text>
    <text x="230" y="1540" class="card-copy">검증된 세 컬럼만 서버에서 전달</text>
  </g>

  <line x1="400" y1="1570" x2="400" y2="1607" stroke="#8da1b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Database lane -->
  <text x="72" y="1640" class="lane">DATABASE</text>
  <line x1="210" y1="1634" x2="728" y2="1634" stroke="#252c39" stroke-width="2"/>

  <!-- Step 6 -->
  <g>
    <rect x="72" y="1660" width="656" height="215" rx="18" fill="#111821" stroke="#52677e" stroke-width="2"/>
    <circle cx="106" cy="1694" r="16" fill="#a9bdd5"/>
    <text x="106" y="1701" text-anchor="middle" class="number">6</text>
    <g transform="translate(150 1680)" fill="none" stroke="#9fb3cb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="25" cy="7" rx="25" ry="7"/>
      <path d="M0 7v34c0 5 11 7 25 7s25-2 25-7V7M0 24c0 5 11 7 25 7s25-2 25-7"/>
    </g>
    <text x="230" y="1708" class="card-title">Supabase</text>
    <text x="230" y="1750" class="card-code code">posts</text>
    <text x="230" y="1790" class="card-copy">서버 전용 클라이언트로 데이터 저장</text>
    <text x="230" y="1828" class="card-copy">작성 시각과 24시간 만료 시각은</text>
    <text x="230" y="1858" class="card-copy">데이터베이스 기본값으로 기록</text>
  </g>

  <line x1="400" y1="1891" x2="400" y2="1925" stroke="#8da1b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Success response -->
  <rect x="140" y="1941" width="520" height="58" rx="29" fill="#111722" stroke="#344052" stroke-width="2"/>
  <text x="400" y="1979" text-anchor="middle" class="response">201 Created → 작성 완료 화면 안내</text>
</svg>
